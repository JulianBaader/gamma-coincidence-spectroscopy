RingBuffer:
  - RB_1:
      number_of_slots: 500
      channel_per_slot: 1000
      data_type:
        1: ['trigger_channel', "int16"]
        2: ['coincidence_channel', "int16"]
  
  - RB_2:
      number_of_slots: 500
      channel_per_slot: 1
      data_type:
        1: ['height', "int16"]

Functions:
  - Fkt_main:
      config_file: "config/general-config.yaml"

  - Fkt_1:
      file_name: "mimoCoRB/file_source"
      fkt_name: "tar_parquet_source"
      config_file: "config/rp-config.yaml"
      num_process: 1
      RB_assign:
        RB_1: "write"

  - Fkt_2:
      file_name: "mimoCoRB/exporters"
      fkt_name: "save_parquet"
      num_process: 1
      RB_assign:
        RB_1: "read"

      
  - Fkt_3:
      file_name: "mimoCoRB/visualizers"
      fkt_name: "vis_osc_obs"
      config_file: "config/osc-config.yaml"
      num_process: 1
      RB_assign:
        RB_1: "observe"


