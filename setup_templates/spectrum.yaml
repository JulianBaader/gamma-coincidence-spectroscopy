RingBuffer:
  - RB_1: None
  
  - RB_2:
      number_of_slots: 500 
      channel_per_slot: 1
      data_type:
        1: ['height', "int16"]

Functions:
  - Fkt_main:
      config_file: "config/general-config.yaml"

  - Fkt_1:
      config_file: "config/rp-config.yaml"
      num_process: 1
      RB_assign:
        RB_1: "write"

  - Fkt_2:
      file_name: "mimoCoRB/analyzers"
      fkt_name: "single"
      config_file: "config/analyzer-config.yaml"
      num_process: 1
      RB_assign:
        RB_1: "read"
        RB_2: "write"

  - Fkt_3:
      file_name: "mimoCoRB/exporters"
      fkt_name: "save_spectrum"
      config_file: "config/spectrum-config.yaml"
      num_process: 1
      RB_assign:
        RB_2: "read"

  - Fkt_4:
      file_name: "mimoCoRB/visualizers"
      fkt_name: "vis_spectrum"
      config_file: "config/spectrum-config.yaml"
      num_process: 1

      
  - Fkt_5:
      file_name: "mimoCoRB/visualizers"
      fkt_name: "vis_osc_obs"
      config_file: "config/osc-config.yaml"
      num_process: 1
      RB_assign:
        RB_1: "observe"


