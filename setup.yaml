Functions:
- Fkt_main:
    config_file: config/general-config.yaml
- Fkt_1:
    RB_assign:
      RB_1: write
    config_file: config/rp-config.yaml
    file_name: mimoCoRB/file_source
    fkt_name: tar_parquet_source
    num_process: 1
- Fkt_2:
    RB_assign:
      RB_1: read
      RB_2: write
    config_file: config/analyzer-config.yaml
    file_name: mimoCoRB/analyzers
    fkt_name: coincidence
    num_process: 1
- Fkt_3:
    RB_assign:
      RB_2: read
    config_file: config/coincidence-config.yaml
    file_name: mimoCoRB/exporters
    fkt_name: save_csv
    num_process: 1
- Fkt_4:
    RB_assign:
      RB_1: observe
    config_file: config/osc-config.yaml
    file_name: mimoCoRB/visualizers
    fkt_name: vis_osc_obs
    num_process: 1
- Fkt_5:
    config_file: config/coincidence-config.yaml
    file_name: mimoCoRB/gamma_coincidence_live_visualisation
    fkt_name: main
    num_process: 1
RingBuffer:
- RB_1:
    channel_per_slot: 1000
    data_type:
      1:
      - coincidence_channel
      - int16
      2:
      - trigger_channel
      - int16
    number_of_slots: 100
- RB_2:
    channel_per_slot: 1
    data_type:
      1:
      - height_1
      - int16
      2:
      - height_2
      - int16
      3:
      - time_difference
      - int16
    number_of_slots: 500
